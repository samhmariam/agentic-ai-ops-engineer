name: CI/CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

# Keep builds and deployments using the shared :latest tag in sequence.
concurrency:
  group: beans-api-deployment
  cancel-in-progress: false

env:
  PROJECT_DIR: module-01-automated-pipelines-ml-monitoring/exercises/09-build-ci-cd-pipeline
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: beans-api
  TASK_DEFINITION: beans-api
  CONTAINER_NAME: beans-api
  ECS_SERVICE: beans-api-service
  ECS_CLUSTER: beans-api-cluster
  MODEL_NAME: nateraw/vit-base-beans

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Lint API and quality checks
        working-directory: ${{ env.PROJECT_DIR }}
        run: ruff check main.py quality_check.py

  quality-check:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.12-pip-${{ hashFiles('module-01-automated-pipelines-ml-monitoring/exercises/09-build-ci-cd-pipeline/requirements-quality.txt') }}
      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-huggingface-${{ env.MODEL_NAME }}
      - name: Install quality-check dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m pip install -r requirements-quality.txt 'deepchecks[vision]>=0.18.0'
      - name: Run model quality checks
        working-directory: ${{ env.PROJECT_DIR }}
        run: python quality_check.py

  build:
    runs-on: ubuntu-latest
    needs: [lint, quality-check]
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker image
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:8}-$(date +%s)"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE_URI:$IMAGE_TAG" .
          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker tag "$IMAGE_URI:$IMAGE_TAG" "$IMAGE_URI:latest"
          docker push "$IMAGE_URI:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION" \
            --query taskDefinition --output json > task-definition.json
      - name: Render task definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
