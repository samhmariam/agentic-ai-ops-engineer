# Runs the FastAPI sentiment service locally, loading the model from the
# MLflow server running on the host machine.
# Docs: https://docs.docker.com/compose/compose-file/
#
# The MLflow server must listen on all interfaces so the container can reach it:
#   uv run mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: finbert-api:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides .env: inside the container, "localhost" is the container itself.
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000
    volumes:
      - ./mlruns:/app/mlruns:ro
      - ./mlartifacts:/app/mlartifacts:ro
    extra_hosts:
      # Resolves host.docker.internal on Linux (Docker Desktop does it automatically).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      # Downloading and loading FinBERT from MLflow takes a couple of minutes.
      start_period: 300s
    restart: unless-stopped
