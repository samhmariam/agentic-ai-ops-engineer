# CI/CD pipeline for the FinBERT sentiment API. Jobs:
# 1. lint        — ruff check
# 2. test        — pytest tests/ with MODEL_SOURCE=huggingface         (needs: lint)
# 3. deepchecks  — scripts/run_deepchecks.py with MODEL_SOURCE=huggingface (needs: lint)
# 4. build       — build the Docker image and push SHA + latest tags to ECR (needs: test, deepchecks)
# 5. deploy      — render the ECS task definition with the new image and deploy to ECS Fargate
#
# GitHub only runs workflows from the repository root, so this pipeline is
# mirrored in /.github/workflows/module-01-ci-cd.yml (run from this directory).
# Keep the two files in sync.
# Documentation: https://docs.github.com/en/actions/writing-workflows

name: test-and-deploy

on:
  push:
    branches: [main]

# Prerequisites — this pipeline expects the following AWS resources:
# 1. An ECR repository named finbert-api to store your Docker images
# 2. An ECS cluster named finbert-cluster
# 3. An ECS service named finbert-api-service running on that cluster
# 4. An ECS task definition named finbert-api
# Also add AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN,
# and AWS_REGION as GitHub repository secrets. The ECR registry URI is
# resolved by the amazon-ecr-login step, so it is not stored as a secret.
env:
  ECR_REPOSITORY: finbert-api
  TASK_DEFINITION: finbert-api
  CONTAINER_NAME: finbert-api
  ECS_SERVICE: finbert-api-service
  ECS_CLUSTER: finbert-cluster
  # Public HuggingFace ids (same values as .env.example)
  HF_MODEL_ID: baptle/FinBERT_market_based
  HF_DATASET_ID: baptle/financial_headlines_market_based
  # CPU-only torch wheels: much smaller/faster to install than the CUDA default
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: new ruff releases enable new default rules and break the build.
      - run: pip install ruff==0.16.9
      - run: ruff check app/ scripts/ tests/ monitoring/

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      MODEL_SOURCE: huggingface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.HF_MODEL_ID }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Downloads the model and patches its float id2label into real label
      # names, which the tests assert on.
      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: Run integration tests
        run: pytest tests/ -v

  deepchecks:
    runs-on: ubuntu-latest
    needs: lint
    env:
      MODEL_SOURCE: huggingface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.HF_MODEL_ID }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate data (dvc repro)
        run: dvc repro

      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: Run deepchecks drift checks
        run: python scripts/run_deepchecks.py

  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: [test, deepchecks]
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build, tag and push image
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker build -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Resolve the registry the same way the build job does, so the image
      # URI rendered here matches the one that was pushed.
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION" \
            --query taskDefinition > task-definition.json

      - name: Render task definition with new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}

      - name: Deploy to ECS Fargate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

