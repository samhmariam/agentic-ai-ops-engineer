[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/realthor"]

[project]
name = "realthor"
version = "0.11.0"
description = "RealThor — Listing Supply Intelligence agent for Ciudaty PropTech"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0.0",
    "langchain>=1.3.0",
    "langchain-openai>=1.2.1",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20.0",
    "langfuse>=3.0.0",
    "fastmcp>=2.0.0",
    "pandas>=2.0.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
realthor = "realthor.app:app"
