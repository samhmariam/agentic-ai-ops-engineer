[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_mcp"]

[project]
name = "proptech-mcp"
version = "0.11.0"
description = "Ciudaty PropTech market-data service exposed over MCP (FastMCP)"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0.0",
    "fastmcp>=2.0.0",
    "pandas>=2.0.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0",
]

# Script is `proptech-mcp`, not `mcp`: the MCP SDK (a fastmcp dependency) already
# ships a `mcp` console script, so `mcp` would collide. `uv run proptech-mcp serve`.
[project.scripts]
proptech-mcp = "company_mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
