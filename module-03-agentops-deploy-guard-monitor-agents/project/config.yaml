# SalesOps Agent default (production) configuration.
# All paths are resolved relative to this file, not the current working directory.
# Validated on load against salesops_agent.config.AppConfig; unknown keys are errors.
# Experiment configs in configs/ extend this file and override only what they change;
# configs/baseline-v1.yaml reproduces the original notebook prototype for comparison.

schema_version: 1

experiment:
  name: guarded-v5
  description: Prompt v2, least-privilege tools, input + tool/action + output guardrails (v1 policies).

agent:
  name: SalesOps Agent
  version: "0.5.0"

model:
  name: openai:gpt-4o-mini   # provider:model, passed to init_chat_model
  temperature: 0.0
  timeout_s: 30       # per API request; stalled calls fail fast and are retried
  max_retries: 2

prompt:
  registry: prompts/registry.yaml
  version: v2

# Tools exposed to the agent, each pinned to a version from the tool registry
# (salesops_agent.tools). Least privilege: the restricted HR/financial tools are not
# exposed (see configs/baseline-v1.yaml for the prototype set). send_email is
# exposed but gated by the tool guardrail: it only runs with human approval.
tools:
  enabled:
    lookup_account: "1.0.0"
    lookup_account_context: "1.0.0"
    list_open_opportunities: "1.1.0"
    summarize_pipeline: "1.0.0"
    draft_email: "1.0.0"
    send_email: "1.0.0"

# Runtime controls, enforced in code around the model:
#  - input: runs before the model sees a request; a blocked request is answered
#    from the policy and never reaches the agent.
#  - tool: wraps every tool; each proposed call is checked against the data access
#    policy (roles, restricted fields, account scope, budgets, unsafe code,
#    approvals) before it executes.
#  - output: inspects the final answer before it is returned; blocks restricted
#    disclosures (safe refusal), routes unsafe email drafts to human review, and
#    redacts raw sensitive values.
guardrails:
  input:
    enabled: true
    policy: policies/input_guardrails_v1.yaml
  tool:
    enabled: true
    policy: policies/tool_guardrails_v1.yaml
  output:
    enabled: true
    policy: policies/output_guardrails_v1.yaml

paths:
  data_dir: data
  email_outbox: data/email_outbox.json
  logs_dir: logs
  traces_dir: traces
  reports_dir: reports
  eval_cases: evaluation/eval_cases.jsonl
  review_queue: review/review_queue.jsonl   # responses withheld for human review

logging:
  file: agent.jsonl   # inside paths.logs_dir
  level: INFO

tracing:
  enabled: true
  max_payload_chars: 2000   # truncate tool inputs/outputs stored in trace files

# USD per 1M tokens, used for cost estimates in logs and reports.
pricing:
  gpt-4o-mini:
    input: 0.15
    output: 0.60
