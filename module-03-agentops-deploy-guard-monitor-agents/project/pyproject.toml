[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salesops_agent"]

[project]
name = "agentops-deploy-guard"
version = "0.1.0"
description = "SalesOps Agent for UdaCenture: the notebook prototype refactored into a versioned, observable Python project"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "langchain>=1.4.5",
    "langchain-openai>=1.7.1",
    "openai>=1.109.1",
    "pydantic>=2.7",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
]

[project.scripts]
salesops = "salesops_agent.cli:app"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
