# Prompt registry. Released prompts are immutable: to change behaviour, add a new
# file and a new entry here, then point config.yaml prompt.version at it.
# sha256 is computed over the text with normalized line endings and surrounding
# whitespace stripped (see salesops_agent.prompts.prompt_hash).

prompts:
